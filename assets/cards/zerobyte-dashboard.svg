<rect x=".5" y=".5" width="599" height="179" rx="14" fill="#050505" stroke="#1f1f1f"/>
<rect x=".5" y=".5" width="599" height="179" rx="14" fill="url(#h)"/>
<rect x="0" y="28" width="3" height="40" rx="1.5" fill="#ff2e88"/>
<g class="g" transform="translate(528 58)"><rect x="-22" y="-17" width="12" height="12" rx="2.5" fill="#ff2e88" opacity="1"/><rect x="-6" y="-17" width="12" height="12" rx="2.5" fill="#ff2e88" opacity="0.4"/><rect x="10" y="-17" width="12" height="12" rx="2.5" fill="#ff2e88" opacity="0.7"/><rect x="-22" y="-1" width="12" height="12" rx="2.5" fill="#ff2e88" opacity="0.4"/><rect x="-6" y="-1" width="12" height="12" rx="2.5" fill="#ff2e88" opacity="1"/><rect x="10" y="-1" width="12" height="12" rx="2.5" fill="#ff2e88" opacity="0.4"/></g>
