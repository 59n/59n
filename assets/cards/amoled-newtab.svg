<svg xmlns="http://www.w3.org/2000/svg" width="600" height="180" viewBox="0 0 600 180" role="img" aria-label="AMOLED New Tab">
<style>
.g{animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translate(528px,58px)}50%{transform:translate(528px,52px)}}
@media (prefers-reduced-motion:reduce){.g{animation:none}}
</style>
<defs>
<radialGradient id="h" cx="1" cy="0" r="1"><stop offset="0" stop-color="#b388ff" stop-opacity=".22"/><stop offset=".55" stop-color="#b388ff" stop-opacity="0"/></radialGradient>
</defs>
<rect x=".5" y=".5" width="599" height="179" rx="14" fill="#050505" stroke="#1f1f1f"/>
<rect x=".5" y=".5" width="599" height="179" rx="14" fill="url(#h)"/>
<rect x="0" y="28" width="3" height="40" rx="1.5" fill="#b388ff"/>
<g class="g" transform="translate(528 58)"><path d="M-24 0 Q0 -22 24 0 Q0 22 -24 0 Z" fill="none" stroke="#b388ff" stroke-width="2.5"/><circle r="7" fill="#b388ff"><animate attributeName="cx" values="-6;6;6;-6;-6" keyTimes="0;.3;.5;.8;1" dur="4s" repeatCount="indefinite"/></circle></g>
