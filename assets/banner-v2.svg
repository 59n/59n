.fade{animation:up .7s ease-out backwards}
.tape{animation:scroll 38s linear infinite}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-origin:1240px 59.8px}
@keyframes pulse{0%,100%{opacity:.9;transform:scale(1)}50%{opacity:.25;transform:scale(2.4)}}
@media (prefers-reduced-motion:reduce){.c,.fade{animation:none}.tape,.cur,.pulse{animation:none}}
</style>
